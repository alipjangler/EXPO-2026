Pertanyaan Umum


Apa perbedaan antara EDP, EDT, dan Extrait de Parfum?
Perbedaan utamanya terletak pada kadar konsentrasi minyak wangi. Extrait memiliki kadar tertinggi (15-40%) yang membuatnya paling tahan lama, disusul oleh Eau de Parfum (EDP: 10-20%), dan Eau de Toilette (EDT: 5-15%).


Apakah bisa mengajukan pengembalian jika aroma tidak cocok?
Pengembalian dana/produk hanya dapat kami proses apabila segel botol utama belum terbuka, atau terjadi kerusakan fisik pada botol saat paket pertama kali diterima (wajib menyertakan video unboxing).
